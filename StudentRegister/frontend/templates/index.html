<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Home - Sistema de Alunos</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>

<body>
    {% include '_messages.html' %}
    <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 text-center gap-4">
        <div class="mb-2">
            <span class="text-uppercase tracking-wider small fw-bold">Plataforma Acadêmica</span>
            <h1 class="display-5 fw-bold mt-1 mb-0">Sistema de Alunos</h1>
        </div>
        <div class="d-flex flex-column gap-3">
            <a href="{{ url_for('student.register') }}" class="btn btn-primary" style="width: 220px">Cadastrar
                Aluno</a>
            <a href="{{ url_for('student.list_students') }}" class="btn btn-secondary" style="width: 220px">Listar
                Alunos</a>
            <a href="{{ url_for('student.reset') }}" class="btn btn-danger" style="width: 220px">Resetar Banco de
                Dados</a>
        </div>
        <footer class="mt-5 pt-3 border-top border-secondary w-100" style="max-width: 400px;">
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('about') }}" class="btn btn-sm btn-outline-light px-3">Sobre</a>
                <a href="{{ url_for('contact') }}" class="btn btn-sm btn-outline-light px-3">Contato</a>
            </div>
        </footer>
    </div>
</body>

</html>
