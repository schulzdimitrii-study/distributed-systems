services:
  backend:
    build: ./backend
    container_name: middleware_backend_C216
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: middleware_frontend_C216
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    env_file:
      - .env
    depends_on:
      - backend

  db:
    image: postgres:latest
    container_name: middleware_postgres_C216
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  tests:
    build: ./backend
    container_name: middleware_tests_C216
    volumes:
      - ./backend:/app
    command: pytest -s -v
    depends_on:
      - db

volumes:
  pgdata:
