services:
  api:
    build: .
    container_name: middleware_api_C216
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
  
  db:
    image: postgres:latest
    container_name: middleware_postgres_C216
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  tests:
    build: .
    container_name: middleware_tests_C216
    volumes:
      - .:/app
    command: pytest -s -v
    depends_on:
      - db

volumes:
  pgdata: